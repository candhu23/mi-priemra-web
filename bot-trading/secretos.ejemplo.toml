# Ejemplo de secretos.toml (lo crea solo la opción 6 del menú, "Configurar los avisos por Telegram").
# Si prefieres hacerlo a mano: copia este archivo, llámalo secretos.toml y rellena los datos.
# NO compartas secretos.toml con nadie ni lo pegues en ningún chat.
[telegram]
token = "123456789:ABCdefGHIjklMNOpqrSTUvwxYZ"   # te lo da @BotFather en Telegram
chat_id = "123456789"                          # tu número de chat (la opción 6 lo averigua sola)
